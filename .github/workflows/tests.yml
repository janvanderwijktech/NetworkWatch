name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for GUI callback tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk
      - name: Check Python syntax
        run: python3 -m compileall -q core.py ipscan.py netwerkwacht.py networkwatch.py ports.py osdetect.py host_actions.py tests
      - name: Run tests (no LAN scanning)
        run: python3 -m unittest discover -s tests -v
